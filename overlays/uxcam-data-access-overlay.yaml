overlay: 1.0.0
info:
  title: API Evangelist enhancements for the UXCam Data Access API
  version: 1.0.0
  x-apievangelist:
    generated: '2026-07-21'
    method: generated
    source: openapi/uxcam-data-access-openapi.yml
extends: openapi/uxcam-data-access-openapi.yml
actions:
