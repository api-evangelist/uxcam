aid: uxcam
name: UXCam
description: UXCam is a mobile-first product analytics and session replay platform
  that helps product, UX, and engineering teams understand how people actually use
  their apps. SDKs for Android, iOS, React Native, Flutter, Cordova, Xamarin/MAUI,
  NativeScript, and the web capture session recordings, heatmaps, gestures, crashes,
  and custom events with built-in PII occlusion, while the Data Access API exposes
  session, user, and event analytics programmatically and an official MCP server
  guides agent-driven SDK integration.
